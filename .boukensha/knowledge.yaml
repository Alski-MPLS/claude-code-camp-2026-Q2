- fact: 'This MUD matches item names on a single distinctive keyword (usually the
    last noun), not the full descriptive string shown in inventory/room listings.
    Passing the full name (e.g. "a bright green newbie vest" or "shiny newbie
    dagger") to examine/get_item/equip_item/drop_item often fails with "You do
    not see that here" or "You don''t have a(n) <first word>." Strip articles and
    color/material adjectives and use just the noun (e.g. "vest", "dagger", "jar")
    — retry with a shorter keyword immediately on that failure instead of
    repeating the full name.'
  source: repeated tool failures during equip_item/get_item/examine (observed 2026-08-06)
  timestamp: '2026-08-06T15:15:00.000000+00:00'
  topic: item name keyword matching
- fact: 'Standard CircleMUD way to check unidentified magic gear: cast_spell(spell="detect
    magic") reveals only whether an item radiates magic (an aura); cast_spell(spell="identify",
    target="<item keyword>") reveals its full stats (level, charges, affects/bonuses)
    — or use a scroll of identify the same way via use_magic_item(mode="recite").
    If the character has no spellcasting skill (e.g. pure Warrior class), the
    fallback on some CircleMUD-derived servers is a sage/shopkeeper NPC who
    identifies gear for a fee — check shop(action="list") text and NPC dialogue
    in any shop for an "identify" service before giving up.'
  source: user research (CircleMUD identify/detect magic mechanics)
  timestamp: '2026-08-06T15:20:00.000000+00:00'
  topic: identifying magic items
- fact: 'A "pitch black" room is not always fixable by equipping a light source —
    confirmed by equip_item(item="torch", action="hold") returning "You''re
    already using a light" while still in total darkness, meaning some rooms
    (an unmapped area east of "The Entrance Hall Of The Grunting Boar Inn",
    reached via a formerly-closed door) are permanently dark regardless of
    carried light, likely a deliberate zone-difficulty flag. When this
    happens: look() and process_room() are useless (both just return "It is
    pitch black..."), but check(kind="exits") still works and lists which
    directions have an exit (shown as "north - Too dark to tell." — the
    destination is unknown but the presence of the exit is not). Use
    check(kind="exits") before each move() to only try directions that
    actually have an exit, instead of blindly guessing all 6 directions. This
    turns blind-maze escape from random guessing into directed search, and
    got the agent out in ~10 moves. Treat any always-dark area as a sign to
    turn back rather than press forward, unless specifically prepared for it.'
  source: observed during dark-maze recovery, 2026-08-07
  timestamp: '2026-08-07T22:05:00.000000+00:00'
  topic: navigating dark rooms without a light source
- fact: 'Always call shop(action="list") when entering or passing through any
    shop room, even if not planning to buy anything -- this builds a running
    record of what each shop sells for future reference (e.g. per user
    request, checking "Ye Olde Water Shoppe" — south of Inside/Outside The
    East Gate Of Midgaard, run by "Wally the Watermaster" — for
    waterskins/jugs useful on long trips). It is easy to walk straight
    through a shop room without checking its inventory (this happened once
    already), so make shop(action="list") a habit whenever a shopkeeper NPC
    is present in process_room() output.'
  source: user request, 2026-08-07
  timestamp: '2026-08-07T22:50:00.000000+00:00'
  topic: shop inventory habit
- fact: 'Some named/roaming town NPCs are far above newbie level and should
    never be farmed: a "green gelatinous blob" and a "Peacekeeper" (The
    Grunting Boar bar) both triggered combat_loop''s safety refusal with
    consider warning "You ARE mad!" (the most severe danger rating seen). The
    blob is NOT confined to one room -- it was first seen at Temple Square,
    then encountered again roaming in Market Square itself, where it
    auto-engaged the character just from trying to move ("No way! You''re
    fighting for your life!") and did real damage (92 -> 56 HP, about 39%)
    before a successful flee. Market Square and other "safe" town hub rooms
    are NOT guaranteed safe -- always check process_room()/NPCs before
    moving through them if you''ve seen the blob recently, and be ready to
    flee immediately if auto-engaged. Separately: if consider fails to
    resolve a target''s keyword ("Consider killing who?" / "No living
    known"), do not fall back to attack() to "test" it -- that lands one
    real hit before any danger check happens. Treat unresolvable
    named/unique NPCs in town as probably too dangerous and skip them;
    reserve the attack()-to-reveal-keyword trick for mobs already known safe
    elsewhere, or ordinary Newbie Zone/Dark Alley mobs.'
  source: observed near-misses with blob (x2, including real damage) and
    Peacekeeper, 2026-08-07
  timestamp: '2026-08-07T22:58:00.000000+00:00'
  topic: dangerous town NPCs to avoid
