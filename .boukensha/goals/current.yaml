current_goal: 'Before continuing to farm: navigate_to your guild entrance hall (The
  Entrance Hall To The Guild Of Swordsmen) where you already know there''s an ATM,
  call bank(action=''balance'') to see what you have banked, withdraw it with bank(action=''withdraw'',
  amount=...), then find a weapon/armor shop and buy basic starter gear with shop(action=''list'')
  then shop(action=''buy'', args=...). You''re still fighting bare-skinned with no
  equipment. Do this before continuing to farm the newbie zone.'
